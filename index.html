<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cursed Games</title>

<style>
body{
    background:#0b0b0f;
    color:#e6e6e6;
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
}

header{
    text-align:center;
    padding:60px 20px;
    background:linear-gradient(180deg,#1a0000,#0b0b0f);
    border-bottom:2px solid #ff2a2a;
}

h1{
    font-size:40px;
    color:#ff2a2a;
    letter-spacing:2px;
    text-shadow:0 0 10px #ff2a2a;
}

.glitch{
    font-size:18px;
    opacity:0.9;
    animation:glitch 1.5s infinite;
}

@keyframes glitch{
    0%{transform:translate(0)}
    20%{transform:translate(-1px,1px)}
    40%{transform:translate(1px,-1px)}
    60%{transform:translate(-1px,0px)}
    80%{transform:translate(1px,1px)}
    100%{transform:translate(0)}
}

section{
    max-width:800px;
    margin:auto;
    padding:30px;
}

h2{
    color:#ff2a2a;
}

.card{
    background:#14141a;
    padding:20px;
    border-left:3px solid #ff2a2a;
    margin-top:20px;
}
</style>

</head>
